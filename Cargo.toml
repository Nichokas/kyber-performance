[package]
name = "crypto_testing"
version = "0.1.0"
edition = "2024"
default-run = "crypto_testing"

[dependencies]
chacha20poly1305 = "0.11.0"
openssl = { version = "0.10.82", features = ["vendored"] }
rand = "0.8.8"
hkdf = "0.13.0"
sha2 = "0.11.2"
oqs = { version = "0.11.0", features = ["vendored_openssl"] }

[dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "kyber_bench"
harness = false

[[bench]]
name = "rsa_bench"
harness = false

[[bench]]
name = "SECP384R1_bench"
harness = false
